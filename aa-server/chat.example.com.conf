map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.example.com;
    # 旧版 nginx 用：listen 443 ssl http2;

    ssl_certificate     /root/.acme.sh/chat.example.com/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/chat.example.com/chat.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;                 # ← 必须
        proxy_set_header Upgrade $http_upgrade; # ← 必须
        proxy_set_header Connection $connection_upgrade;  # ← 必须

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接（会话/仪表盘 WebSocket 会一直挂着）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}